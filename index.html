<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pico-8 Editor</title>
<style>
  canvas, img {
    image-rendering: pixelated;
    vertical-align: top;
  }
  iframe {
    background: #000;
    display: block;
  }
  button {
    user-select: none;
  }
  #controls {
    width: fit-content;
    display: flex;
    align-items: center;
    touch-action: none;
  }

  #dpad {
    width: 128px;
    height: 128px;
    background: #ddd;
    border: 2px solid #999;
    touch-action: none;
  }

  #controls button {
    width: 64px;
    height: 64px;
    font-size: 24px;
    touch-action: none;
    user-select: none;
  }
</style>
</head>
<body>
<iframe id="frame" width="256" height="256" frameborder="0" scrolling="no" allow="autoplay; fullscreen; gamepad"></iframe>
<section id="controls">
  <div id="dpad"></div>
  <button id="z">Z</button>
  <button id="x">X</button>
</section>
<section>
  <button id="pp">pause</button>
  <button id="mute">mute</button>
  <button id="reset">reset</button>
  <button id="fs">fullscreen</button>
</section>
<section>
  <button id="load">load</button>
  <!--button id="loadurl">load url/id</button-->
  <button id="save">save</button>
  <button id="run">run</button>
  <button id="cap">capture label</button>
</section>
<div id="msg"></div>
<textarea id="code" rows="16" cols="32" spellcheck="false"></textarea>
<section>
  <img id="cartimg" alt="cart">
  <button id="downloadp8">download .p8</button>
</section>
<section>
  <canvas id="gfx" width="128" height="128" style="width:256px;height:256px"></canvas>
  <canvas id="map" width="1024" height="512" style="width:512px;height:256px"></canvas>
</section>
<input id="file" type="file" accept=".png,.p8" hidden>

<script type="module">

import { newCart, decodeP8, decodePng, encodePng, encodeP8, PAL, nearest } from "./cart.js";

const DEFAULT_CODE = `-- hello world

t = 0

function _update()
  t += 1
end

function _draw()
  cls()
  local s = "hello world "..t;
  print(s,64-#s*2,64-2,7)
end
`;

let cart = newCart(DEFAULT_CODE);
let fileHandle = null;

const hasFsApi = "showOpenFilePicker" in window;

const cartTypes = [{
  description: "PICO-8 cart",
  accept: { "image/png": [".png"], "text/plain": [".p8"] }
}];

const gfxPixel = (x, y) => {
  const b = cart.gfx[(y | 0) * 64 + ((x | 0) >> 1)];
  return (x & 1) ? b >> 4 : b & 15;
};

const b64 = bytes => {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s);
};

const cartBytes = name => /\.p8$/i.test(name)
  ? Uint8Array.from(encodeP8(cart), c => c.charCodeAt(0) & 255)
  : encodePng(cart);

const download = (data, name) => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data]));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

function boot(png) {
  frame.srcdoc = `<!doctype html>
  <html>
  <head>
  <meta charset="utf-8">
  <style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  </style>
  </head>
  <body>
  <canvas id="canvas" style="image-rendering:pixelated" oncontextmenu="return false"></canvas>
  <script>
  var Module;
  var playable_area_count = 0;
  var playarea_state = 0;
  var codo_command = 0;
  var codo_command_p = 0;
  var codo_volume = 256;
  var codo_running = true;
  var pa_pid = [${Array(40).fill(0)}];
  Module = {
    arguments: ["cart.p8.png"],
    canvas: document.getElementById("canvas")
  };
  Module.preRun = [
    function() {
      var bin = atob("${b64(png)}");
      var b = new Uint8Array(bin.length);
      for (var i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
      var orig = Module.readAsync;
      Module.readAsync = function(url,onload,onerror) {
        if (/\\.p8\\.png$/i.test(url)) {
          setTimeout(function(){onload(b.buffer)},30);
          return;
        }
        if (orig) return orig(url,onload,onerror);
      };
    }
  ];
  <\/script>
  <script src="https://www.lexaloffle.com/play/pico8_0207.js"><\/script>
  <script>
  document.addEventListener("pointerdown", function() {
    var a = window.pico8_audio_context;
    if (a&&a.state==="suspended") a.resume();
  },true);
  document.addEventListener("keydown", function(e) {
    if (e.key.indexOf("Arrow")==0||e.key===" ") e.preventDefault();
  });
  <\/script>
  </body>
  </html>`;
}

function drawSheet() {
  const g = gfx.getContext("2d");
  const img = g.createImageData(128, 128);
  for (let i = 0; i < 16384; i++) {
    const c = PAL[gfxPixel(i & 127, i >> 7)];
    const o = i * 4;
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}

function drawMap() {
  const g = map.getContext("2d");
  const img = g.createImageData(1024, 512);
  for (let row = 0; row < 64; row++) {
    for (let col = 0; col < 128; col++) {
      const t = row < 32 ? cart.map[row * 128 + col] : 0;
      for (let py = 0; py < 8; py++) {
        for (let px = 0; px < 8; px++) {
          const c = row < 32
            ? PAL[gfxPixel((t & 15) * 8 + px, (t >> 4) * 8 + py)]
            : PAL[gfxPixel(col * 8 + px, 64 + (row - 32) * 8 + py)];
          const o = ((row * 8 + py) * 1024 + col * 8 + px) * 4;
          img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
        }
      }
    }
  }
  g.putImageData(img, 0, 0);
}

function refresh(rerun) {
  try {
    const png = encodePng(cart);
    if (cartimg.src.startsWith("blob:")) URL.revokeObjectURL(cartimg.src);
    cartimg.src = URL.createObjectURL(new Blob([png], { type: "image/png" }));
    msg.textContent = "";
    if (rerun) boot(png);
  } catch (e) {
    msg.textContent = e.message;
  }
}

async function openCart(bytes, name) {
  try {
    cart = /\.p8$/i.test(name) ? decodeP8(bytes) : await decodePng(bytes);
    code.value = cart.code;
    msg.textContent = "";
    drawSheet();
    drawMap();
    refresh(true);
  } catch (e) {
    msg.textContent = e.message;
  }
}

async function pickLoad() {
  if (!hasFsApi) { file.click(); return; }
  try {
    const [handle] = await window.showOpenFilePicker({ types: cartTypes });
    fileHandle = handle;
    const f = await handle.getFile();
    await openCart(new Uint8Array(await f.arrayBuffer()), handle.name);
  } catch (e) {
    if (e.name !== "AbortError") msg.textContent = e.message;
  }
}

async function saveCart() {
  try {
    if (!fileHandle && hasFsApi) {
      fileHandle = await window.showSaveFilePicker({ suggestedName: "cart.p8.png", types: cartTypes });
    }
    if (fileHandle) {
      const perm = await fileHandle.queryPermission({ mode: "readwrite" });
      if (perm !== "granted" && (await fileHandle.requestPermission({ mode: "readwrite" })) !== "granted") return;
      const w = await fileHandle.createWritable();
      await w.write(cartBytes(fileHandle.name));
      await w.close();
      msg.textContent = "saved " + fileHandle.name;
    } else {
      download(encodePng(cart), "cart.p8.png");
    }
  } catch (e) {
    if (e.name !== "AbortError") msg.textContent = e.message;
  }
}

code.oninput = e => { cart.code = e.target.value; };
run.onclick = () => refresh(true);
load.onclick = pickLoad;
save.onclick = saveCart;
downloadp8.onclick = () => download(Uint8Array.from(encodeP8(cart), c => c.charCodeAt(0) & 255), "cart.p8");

pp.onclick = () => { try { frame.contentWindow.Module.pico8TogglePaused(); } catch {} };
mute.onclick = () => { try { frame.contentWindow.Module.pico8ToggleSound(); } catch {} };
reset.onclick = () => { try { frame.contentWindow.Module.pico8Reset(); } catch {} };
fs.onclick = () => { document.fullscreenElement ? document.exitFullscreen() : frame.requestFullscreen(); };

const resizeFrame = () => {
  const cv = frame.contentWindow && frame.contentWindow.document.getElementById("canvas");
  if (!cv) return;
  const s = document.fullscreenElement ? Math.max(1, Math.floor(Math.min(innerWidth, innerHeight) / 128)) * 128 : 256;
  cv.style.width = cv.style.height = s + "px";
};
document.addEventListener("fullscreenchange", resizeFrame);
frame.addEventListener("load", resizeFrame);

cap.onclick = () => {
  try {
    const cv = frame.contentWindow.document.getElementById("canvas");
    const t = document.createElement("canvas");
    t.width = t.height = 128;
    const g = t.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.drawImage(cv, 0, 0, 128, 128);
    const px = g.getImageData(0, 0, 128, 128).data;
    for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
      const o = (y * 128 + x) * 4;
      cart.label[y * 128 + x] = nearest(px[o], px[o + 1], px[o + 2]);
    }
    refresh();
  } catch {}
};

file.onchange = async e => {
  const f = e.target.files[0];
  if (f) {
    fileHandle = null;
    await openCart(new Uint8Array(await f.arrayBuffer()), f.name);
  }
  e.target.value = "";
};

document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", async e => {
  e.preventDefault();
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  if (!item || item.kind !== "file") return;
  if (item.getAsFileSystemHandle) {
    const handle = await item.getAsFileSystemHandle();
    if (handle.kind !== "file") return;
    fileHandle = handle;
    const f = await handle.getFile();
    await openCart(new Uint8Array(await f.arrayBuffer()), handle.name);
  } else {
    const f = item.getAsFile();
    if (!f) return;
    fileHandle = null;
    await openCart(new Uint8Array(await f.arrayBuffer()), f.name);
  }
});

code.value = cart.code;
drawSheet();
drawMap();
refresh(true);

const held = new Set();

const keyCodes = {
  ArrowLeft: 37,
  ArrowUp: 38,
  ArrowRight: 39,
  ArrowDown: 40,
  z: 90,
  x: 88
};

function sendKey(type, key) {
  const e = new KeyboardEvent(type, {
    key,
    code: key.startsWith("Arrow") ? key : "Key" + key.toUpperCase(),
    bubbles: true,
    cancelable: true
  });
  Object.defineProperty(e, "keyCode", { value: keyCodes[key] });
  Object.defineProperty(e, "which", { value: keyCodes[key] });
  frame.contentWindow.document.dispatchEvent(e);
}

function press(key) {
  if (!held.has(key)) {
    held.add(key);
    sendKey("keydown", key);
  }
}

function release(key) {
  if (held.has(key)) {
    held.delete(key);
    sendKey("keyup", key);
  }
}

const arrowKeys = ["ArrowLeft", "ArrowUp", "ArrowRight", "ArrowDown"];

let dpadPointer = null;

function updateDpad(e) {
  const r = dpad.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width;
  const py = (e.clientY - r.top) / r.height;
  const col = Math.min(2, Math.floor(px * 3));
  const row = Math.min(2, Math.floor(py * 3));
  const keys = [];
  if (col === 0) keys.push("ArrowLeft");
  if (col === 2) keys.push("ArrowRight");
  if (row === 0) keys.push("ArrowUp");
  if (row === 2) keys.push("ArrowDown");
  for (const key of arrowKeys) {
    keys.includes(key) ? press(key) : release(key);
  }
}

dpad.addEventListener("pointerdown", e => {
  e.preventDefault();
  dpadPointer = e.pointerId;
  dpad.setPointerCapture(e.pointerId);
  updateDpad(e);
});

dpad.addEventListener("pointermove", e => {
  if (e.pointerId === dpadPointer) {
    e.preventDefault();
    updateDpad(e);
  }
});

function releaseDpad(e) {
  if (e.pointerId !== dpadPointer) return;
  for (const key of arrowKeys) release(key);
  dpadPointer = null;
}

dpad.addEventListener("pointerup", releaseDpad);
dpad.addEventListener("pointercancel", releaseDpad);

function setupButton(button, key) {
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    press(key);
  });
  button.addEventListener("pointerup", e => {
    e.preventDefault();
    release(key);
  });
  button.addEventListener("pointercancel", () => release(key));
}
setupButton(z, "z");
setupButton(x, "x");

</script>

</body>
</html>
